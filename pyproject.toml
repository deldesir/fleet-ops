[project]
name = "fleet_ops"
authors = [{ name = "Blondel Mondesir", email = "blondel.md@gmail.com" }]
description = "Managed-fleet operations for Frappe benches: boxes, health checks, releases, next to ERPNext subscriptions"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev"
